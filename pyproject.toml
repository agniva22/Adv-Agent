[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "advagent"
version = "1.0.0"
description = "Shielded reinforcement learning for resilient distributed optimization"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "networkx", "torch"]

[tool.setuptools]
packages = ["advagent"]
